<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  <script type="module" src="{{ url_for('static', path='/js/wallet.js') }}?v=4"></script>
  <script type="module" src="{{ url_for('static', path='/js/evaluation.js') }}?v=1"></script>
</head>
<body data-chain-id="{{ chain_id }}" data-escrow="{{ escrow_address }}" data-token="{{ token_address }}"
  data-user-wallet="{{ user.wallet_address if user else '' }}">
  <header class="site-header">
    <a class="brand" href="/">{{ app_name }}</a>
    <nav>
      {% if user %}
        <span class="wallet" title="{{ user.wallet_address }}">{{ user.wallet_address[:6] }}…{{ user.wallet_address[-4:] }}</span>
        <a class="button secondary" href="/calls/new">Create call</a>
        <button class="link-button" data-logout>Sign out</button>
      {% else %}
        <button class="button" data-wallet-login>Connect wallet</button>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    <div id="wallet-message" class="notice" hidden></div>
    {% block content %}{% endblock %}
  </main>
  <footer>Hackathon demo · Avalanche Fuji · AI recommendations require caller review</footer>
</body>
</html>
