{% extends "base.html" %}
{% block title %}{{ form_title }} · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-heading">
  <p class="eyebrow">{{ form_title }}</p>
  <h1 data-i18n="describe_dataset">Describe the smallest useful dataset</h1>
</div>
<form class="panel form-grid" method="post" action="{{ form_action }}">
  <label><span data-i18n="title">Title</span><input name="title" maxlength="120" required placeholder="Street trees in Ho Chi Minh City" value="{{ data_call.title if data_call else '' }}"></label>
  <label><span data-i18n="data_type">Data type</span><select name="data_type"><option value="image_text" {% if not data_call or data_call.data_type in ['image', 'image_text'] %}selected{% endif %} data-i18n="image_text">Image-Text pairs</option><option value="csv" {% if data_call and data_call.data_type == 'csv' %}selected{% endif %}>CSV</option></select></label>
  <label class="full"><span data-i18n="description">Description</span><textarea name="description" required placeholder="What the data will be used for">{{ data_call.description if data_call else '' }}</textarea></label>
  <label class="full"><span data-i18n="criteria">Acceptance criteria</span><textarea name="acceptance_criteria" required placeholder="One clear subject, daylight, no visible faces, location in metadata">{{ data_call.acceptance_criteria if data_call else '' }}</textarea></label>
  <label><span data-i18n="review_mode">Review mode</span><select name="review_mode"><option value="ai_assisted" {% if not data_call or data_call.review_mode == 'ai_assisted' %}selected{% endif %} data-i18n="ai_assisted">AI-assisted</option><option value="manual" {% if data_call and data_call.review_mode == 'manual' %}selected{% endif %} data-i18n="manual">Manual</option></select></label>
  <label><span data-i18n="maximum_accepted">Maximum accepted</span><input type="number" name="max_acceptances" min="1" max="100" value="{{ data_call.max_acceptances if data_call else 5 }}" required></label>
  <label><span data-i18n="standard_reward">Standard reward</span> ({{ token_symbol }})<input type="number" name="standard_reward" min="0.000001" step="0.000001" value="{{ format_token(data_call.standard_reward, token_decimals) if data_call else 1 }}" required></label>
  <label><span data-i18n="high_reward">High reward (optional)</span><input type="number" name="high_reward" min="0.000001" step="0.000001" value="{{ format_token(data_call.high_reward, token_decimals) if data_call and data_call.high_reward else '' }}" placeholder="2"></label>
  <label><span data-i18n="deadline">Deadline (UTC)</span><input type="datetime-local" name="deadline" value="{{ data_call.deadline.strftime('%Y-%m-%dT%H:%M') if data_call else '' }}" required></label>
  <label class="full"><span data-i18n="author_links">Author links</span><textarea name="links_text" maxlength="3000" placeholder="Portfolio | https://example.com&#10;GitHub | https://github.com/name">{% if data_call %}{% for link in data_call.links %}{{ link.label }} | {{ link.url }}{% if not loop.last %}&#10;{% endif %}{% endfor %}{% endif %}</textarea><small class="muted" data-i18n="links_help">Optional. One link per line, up to five. Use Label | https://example.com.</small></label>
  <div class="full actions"><button class="button" type="submit">{{ submit_label }}</button><a href="{{ '/calls/' ~ data_call.id if data_call else '/' }}" data-i18n="cancel">Cancel</a></div>
</form>
{% endblock %}
