[project]
name = "databounty"
version = "0.1.0"
description = "Minimal AI-assisted dataset bounty marketplace on Avalanche Fuji"
requires-python = ">=3.12"
dependencies = [
  "eth-account>=0.13.7",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "itsdangerous>=2.2.0",
  "pillow>=11.3.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.41",
  "uvicorn[standard]>=0.35.0",
  "web3>=7.13.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.16.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.16.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependency markers intentionally call Depends/Form/File.

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

